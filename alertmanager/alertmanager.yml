route:
  receiver: default
  group_by: ['alertname', 'vendor']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    slack_configs:
      - api_url: "https://hooks.slack.com/services/REDACTED/REDACTED/REDACTED"
        channel: "rmm-alets"
        send_resolved: true
        title: "{{ .CommonLabels.alertname }} ({{ len .Alerts.Firing }} firing)"
        text: "{{ range .Alerts }}• {{ .Annotations.summary }}{{ if .Annotations.description }} — {{ .Annotations.description }}{{ end }}\n{{ end }}"

# Alternative: PagerDuty
#  - name: default
#    pagerduty_configs:
#      - routing_key: "REPLACE_WITH_PAGERDUTY_INTEGRATION_KEY"
